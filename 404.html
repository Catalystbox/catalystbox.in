<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found - CatalystBox</title>
  <script src="/assets/js/thinkmap-refresh.js"></script>
  <script>
    if (!window.__THINKMAP_REFRESH_REDIRECTING__) {
      try {
        var path = window.location.pathname.replace(/\/index\.html$/i, '').replace(/\/+$/, '') || '/';
        if (path && path !== '/') {
          sessionStorage.setItem('redirectRoute', path);
        }
      } catch (e) {}
      window.location.replace('/' + (window.location.search || ''));
    }
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The requested page does not exist.</p>
    <p><a href="/">Return to CatalystBox</a></p>
  </main>
</body>
</html>
